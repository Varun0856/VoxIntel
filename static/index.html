<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VoxIntel</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header class="top-bar">
      <div>
        <h1>VoxIntel</h1>
        <p class="subtitle">Panel recordings, transcribed and summarized.</p>
      </div>
      <button id="themeToggle" class="icon-btn" aria-label="Toggle light and dark mode" title="Toggle theme">
        <svg id="iconMoon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M21 12.8A9 9 0 1111.2 3 7.2 7.2 0 0021 12.8z"/></svg>
        <svg id="iconSun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" class="hidden"><circle cx="12" cy="12" r="4.5"/><path d="M12 2.5v2.5M12 19v2.5M4.2 4.2l1.8 1.8M18 18l1.8 1.8M2.5 12H5M19 12h2.5M4.2 19.8L6 18M18 6l1.8-1.8"/></svg>
      </button>
    </header>

    <div id="errorBanner" class="error-banner hidden" role="alert"></div>

    <section class="recorder">
      <div class="recorder-row">
        <button id="startBtn" class="btn btn-primary">Start recording</button>
        <button id="stopBtn" class="btn btn-outline" disabled>Stop recording</button>
        <select id="micSelect" class="mic-select" title="Audio input source"></select>
        <span class="rec-indicator">
          <span id="recDot" class="dot hidden"></span>
          <span id="recStatus">Idle</span>
        </span>
      </div>
    </section>

    <section id="sessionPanel" class="session-panel hidden">
      <div class="panel-row">
        <h2>Transcript</h2>
        <span id="sessionStatus" class="status"></span>
      </div>
      <p id="transcript" class="transcript-text">—</p>

      <div class="action-row">
        <button id="summaryBtn" class="btn btn-primary" disabled>Generate summary</button>
        <button id="exportBtn" class="btn btn-outline" disabled>Export</button>
        <button id="deleteBtn" class="btn btn-text" disabled>Delete</button>
      </div>

      <div id="summaryBox" class="summary-box hidden">
        <h2>Top Takeaways</h2>
        <div id="summaryText"></div>
      </div>
    </section>

    <section class="history">
      <h2>Past sessions</h2>
      <p id="historyEmpty" class="empty-note">No past sessions yet.</p>
      <ul id="sessionList" class="session-list"></ul>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
